server.port=8082
spring.application.name=attendance-service
spring.datasource.url=${ATTENDANCE_DB_URL:jdbc:postgresql://localhost:5432/attendance_db}
spring.datasource.username=${ATTENDANCE_DB_USERNAME:postgres}
spring.datasource.password=${ATTENDANCE_DB_PASSWORD:ibest@123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=3
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
app.attendance.default-shift-start=${ATTENDANCE_SHIFT_START:09:30}
app.attendance.default-shift-end=${ATTENDANCE_SHIFT_END:16:30}
app.attendance.zone-id=${ATTENDANCE_ZONE_ID:Asia/Kolkata}
logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc=INFO
