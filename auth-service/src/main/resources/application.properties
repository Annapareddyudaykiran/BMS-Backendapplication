server.port=8081
spring.application.name=auth-service
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authentication_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:ibest@123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=3
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc=INFO
