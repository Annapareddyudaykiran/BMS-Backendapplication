server.port=8080
spring.application.name=api-gateway
app.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8081}
app.attendance-service-url=${ATTENDANCE_SERVICE_URL:http://localhost:8082}
app.work-order-service-url=${WORK_ORDER_SERVICE_URL:http://localhost:8083}
app.asset-service-url=${ASSET_SERVICE_URL:http://localhost:8084}
app.inventory-service-url=${INVENTORY_SERVICE_URL:http://localhost:8085}
app.hse-service-url=${HSE_SERVICE_URL:http://localhost:8086}
app.amc-service-url=${AMC_SERVICE_URL:http://localhost:8087}
app.iot-service-url=${IOT_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${app.auth-service-url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[1].id=attendance-service
spring.cloud.gateway.routes[1].uri=${app.attendance-service-url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/attendance/**
spring.cloud.gateway.routes[2].id=property-service
spring.cloud.gateway.routes[2].uri=${app.attendance-service-url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/property/**
spring.cloud.gateway.routes[3].id=helpdesk-service
spring.cloud.gateway.routes[3].uri=${app.attendance-service-url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/helpdesk/**
spring.cloud.gateway.routes[4].id=work-order-service
spring.cloud.gateway.routes[4].uri=${app.work-order-service-url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/work-orders/**
spring.cloud.gateway.routes[5].id=asset-service
spring.cloud.gateway.routes[5].uri=${app.asset-service-url}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/assets/**
spring.cloud.gateway.routes[6].id=inventory-service
spring.cloud.gateway.routes[6].uri=${app.inventory-service-url}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.routes[7].id=procurement-service
spring.cloud.gateway.routes[7].uri=${app.inventory-service-url}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/procurement/**
spring.cloud.gateway.routes[8].id=hse-safety-service
spring.cloud.gateway.routes[8].uri=${app.hse-service-url}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/safety/**
spring.cloud.gateway.routes[9].id=amc-vendor-service
spring.cloud.gateway.routes[9].uri=${app.amc-service-url}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/contracts/**
spring.cloud.gateway.routes[10].id=iot-service
spring.cloud.gateway.routes[10].uri=${app.iot-service-url}
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/iot/**
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
management.endpoints.web.exposure.include=health
